  <line x1="180" y1="630" x2="1420" y2="630" stroke="#e8b923" stroke-width="2" opacity="0.4"/>
  <text x="220" y="690" font-family="Inter,system-ui,sans-serif" font-size="26" fill="#c4b4b7">Squad</text>
  <text x="640" y="690" font-family="Inter,system-ui,sans-serif" font-size="26" fill="#ffffff">9/12 · 7/12 · 11/12 · 5/12 players</text>
  <text x="800" y="800" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" fill="#c4b4b7">Every bid updates purses and squads instantly — visible to owners and the room.</text>
