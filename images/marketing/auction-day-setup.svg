<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img">
  <rect width="1600" height="900" fill="#0a0809"/>
  <ellipse cx="800" cy="120" rx="520" ry="180" fill="#e11d2e" opacity="0.10"/>
  <text x="800" y="80" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="40" font-weight="700" fill="#ffffff">Auction day setup</text>
  <!-- Big display -->
  <rect x="600" y="160" width="400" height="260" rx="16" fill="#1c1518" stroke="#e8b923" stroke-width="3"/>
  <rect x="630" y="190" width="340" height="120" rx="10" fill="#0a0809" stroke="#e11d2e" stroke-width="2"/>
  <text x="800" y="245" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="30" fill="#c4b4b7">Player card</text>
  <text x="800" y="285" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" fill="#e8b923">Current bid · Countdown</text>
  <text x="800" y="360" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="600" fill="#ffffff">Big display</text>
  <text x="800" y="398" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" fill="#c4b4b7">player card · live bid · purse left</text>
  <!-- Operator -->
  <rect x="180" y="520" width="380" height="220" rx="16" fill="#1c1518" stroke="#e8b923" stroke-width="3"/>
  <rect x="210" y="550" width="320" height="80" rx="8" fill="#0a0809" stroke="#e11d2e" stroke-width="2"/>
  <text x="370" y="600" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" fill="#c4b4b7">Control screen</text>
  <text x="370" y="680" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="600" fill="#ffffff">Operator</text>
  <text x="370" y="716" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" fill="#c4b4b7">runs cards &amp; countdown</text>
  <!-- Owners -->
  <rect x="1040" y="520" width="380" height="220" rx="16" fill="#1c1518" stroke="#e8b923" stroke-width="3"/>
  <rect x="1070" y="550" width="130" height="80" rx="8" fill="#0a0809" stroke="#e11d2e" stroke-width="2"/>
  <rect x="1215" y="550" width="130" height="80" rx="8" fill="#0a0809" stroke="#e11d2e" stroke-width="2"/>
  <text x="370" y="600" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" fill="#c4b4b7" opacity="0">.</text>
  <text x="1135" y="600" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="20" fill="#c4b4b7">bid</text>
  <text x="1280" y="600" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="20" fill="#c4b4b7">bid</text>
  <text x="1230" y="680" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="28" font-weight="600" fill="#ffffff">Team owners</text>
  <text x="1230" y="716" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="22" fill="#c4b4b7">bidding devices</text>
  <!-- connectors -->
  <line x1="370" y1="520" x2="660" y2="400" stroke="#e8b923" stroke-width="2" stroke-dasharray="10 8" opacity="0.7"/>
  <line x1="1230" y1="520" x2="940" y2="400" stroke="#e8b923" stroke-width="2" stroke-dasharray="10 8" opacity="0.7"/>
  <text x="800" y="820" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="24" fill="#c4b4b7">Everyone sees the same live picture — no spreadsheet, no shouting across the room.</text>
</svg>
